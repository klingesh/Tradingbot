# ---------------------------------------------------------------------------
# LIVE / DEMO trading configuration TEMPLATE
# ---------------------------------------------------------------------------
# FIRST-RUN SETUP: copy this file to config/live_config.yaml, then edit it.
#   Windows:  copy config\live_config.example.yaml config\live_config.yaml
#   Mac/Linux: cp config/live_config.example.yaml config/live_config.yaml
#
# Your real config/live_config.yaml is gitignored, so your personal settings
# (symbols, risk, dry_run) will NEVER conflict with future `git pull`s.
# ---------------------------------------------------------------------------

# Keep dry_run: true until you've watched the bot behave. It then LOGS what it
# WOULD do without sending orders. Set to false to place (demo!) orders.
dry_run: true

connection:
  # Leave login/password/server blank to use the account already logged into
  # your MT5 terminal (recommended for demo). Fill only if you must.
  login:
  password:
  server:
  # path: "C:/Program Files/JustMarkets MT5/terminal64.exe"

# Broker's REAL symbol names. VERIFY these with: python scripts/check_mt5.py
# (These are the confirmed JustMarkets ECN-demo names; other brokers differ.)
symbols:
  GOLD:     XAUUSD.ecn
  SILVER:   XAGUSD.ecn
  AUDUSD:   AUDUSD.ecn
  USDJPY:   USDJPY.ecn
  NATGAS:   XNGUSD.ecn
  PLATINUM: XPTUSD.ecn
  GBPJPY:   GBPJPY.ecn
  BRENT:    BRENT.ecn
  # BTC:    BTCUSD.ecn      # optional crypto slot (see portfolio.OPTIONAL_CRYPTO)

risk:
  # With 8 instruments, 2% each = up to 16% at risk if all fire at once. Since
  # the basket is diversified, consider ~1.0-1.5% per trade as the universe grows.
  risk_percent_per_trade: 2.0
  max_risk_percent_per_trade: 5.0
  max_open_trades: 8                # one per instrument in the portfolio
  max_daily_loss_percent: 6.0       # halt new trades for the day past this loss
  max_total_drawdown_percent: 20.0  # KILL SWITCH: stop the bot entirely

news_filter:
  enabled: true          # ON for live (protects vs news-time spread widening)
  before_minutes: 120
  after_minutes: 120

run:
  magic_number: 990011   # tags this bot's trades
  poll_seconds: 60       # how often to check for a new closed bar
  candles_lookback: 400  # bars fetched per check (enough for indicators)
